[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dytopo-mcp"
version = "0.1.0"
description = "Dynamic Topology Routing MCP Server for Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0"
]

[project.scripts]
dytopo-server = "server:main"
