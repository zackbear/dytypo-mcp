[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dytopo-mcp"
version = "0.2.0"
description = "Dynamic Topology Routing MCP Server for Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["voyageai>=0.2.0"]
local = ["sentence-transformers>=2.7.0"]
schedule = ["schedule>=1.2.0"]
all = [
    "openai>=1.0.0",
    "voyageai>=0.2.0",
    "sentence-transformers>=2.7.0",
    "schedule>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/zackbear/dytypo-mcp"
Repository = "https://github.com/zackbear/dytypo-mcp"
"Bug Tracker" = "https://github.com/zackbear/dytypo-mcp/issues"

[project.scripts]
dytopo-server = "server:main"
